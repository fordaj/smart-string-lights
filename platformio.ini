; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]

src_dir = Embedded/src
include_dir = Embedded/src
test_dir = Embedded/test

; ────────────────────────────────────────────────
; COMMON SETTINGS — inherited by ALL environments
; ────────────────────────────────────────────────
[env]
monitor_speed    = 115200

; ────────────────────────────────────────────────
; ESP32-S3
; ────────────────────────────────────────────────
[env:ESP32_S3]
framework        = arduino
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board       = esp32-s3-devkitc-1
lib_deps =
    Preferences@3.3.11
    fastled/FastLED@^3.9.0
    tzapu/WiFiManager@2.0.17
    bblanchon/ArduinoJson@7.4.3

build_flags =
    -std=c++17
    -DPLATFORM_ARDUINO
    -DBOARD_ESP32_S3
    -I.version
    -IEmbedded/lib
    -IEmbedded/web
    -IEmbedded/src/Application
    -IEmbedded/src/Devices
    -IEmbedded/src/Peripherals
    -IEmbedded/src/Peripherals/Arduino
    -IEmbedded/src/Infrastructure
    -IEmbedded/src/Infrastructure/Arduino
    -IEmbedded/src/Platform
    -IEmbedded/src/Services
    -IEmbedded/src/Services/Arduino
    -IEmbedded/src/Units

; Override the data pin / pixel count at build time, e.g.:
;   pio run -e ESP32_S3 --project-option="build_flags=..."
; or just edit Embedded/src/Application/Configuration.hpp.

[env:ESP32_S3_EMULATED]
extends = env:ESP32_S3
build_flags =
    ${env:ESP32_S3.build_flags}
    -D EMULATED

; ────────────────────────────────────────────────
; Host (native) — full stack on your PC:
; HTTP on :8080, strip rendered as ANSI truecolor blocks.
; ────────────────────────────────────────────────

[env:host]
platform = native
extra_scripts =
    Embedded/scripts/host.py

test_framework = unity
test_build_src = false

build_flags =
    -std=c++17
    -DPLATFORM_PC
    -I.version
    -IEmbedded/web
    -IEmbedded/lib
    -IEmbedded/src/Application
    -IEmbedded/src/Infrastructure
    -IEmbedded/src/Infrastructure/PC
    -IEmbedded/src/Platform
    -IEmbedded/src/Services
    -IEmbedded/src/Services/PC
    -IEmbedded/src/Devices
    -IEmbedded/src/Peripherals
    -IEmbedded/src/Peripherals/PC
    -IEmbedded/src/Units
