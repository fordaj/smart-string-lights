# smart-string-lights is a PlatformIO/C++ embedded project; the Python side exists to
# support the build and test tooling (platformio, esptool, serial tests).
# The project is not a packaged Python application (no build step, no
# [build-system]); uv manages the environment only.
[project]
name = "smart-string-lights"
version = "0.0.0"
description = "RGB smart string lights with smart home support (ESP32-S3) — build and test tooling"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "platformio==6.1.19",
  "esptool==5.3.1",
  "pyserial>=3.5",
  "requests>=2.31,<3",
  "loguru>=0.7.3",
  # The espressif32 builder imports littlefs at build time; the PlatformIO
  # penv ships a cp313 binary on some machines, so provide it in the venv too.
  "littlefs-python>=0.19.0",
]

# formattington (the uv dev-dependency in fordaj/RecipeServer) requires
# Python >= 3.14, while PlatformIO's littlefs binary in the penv is built
# for cp313 - the venv must therefore stay on 3.13. Formatting goes through
# scripts/format.sh, which prefers an available `formattington` and falls
# back to the pinned `tools/formattington-lite` bundle.
[dependency-groups]
dev = ["black>=24.0"]

[tool.black]
line-length = 150
